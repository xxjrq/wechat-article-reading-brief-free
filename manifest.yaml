name: wechat-article-reading-brief-free
slug: wechat-article-reading-brief-free
display_name: 公众号文章阅读简报
description: 使用用户指定的 Easy WebBridge 浏览器读取 1–3 篇公开公众号文章 URL，针对关注问题交付主结论、关键步骤、作者、日期、来源与未显示项。适用于短文、章节和单一场景的可溯源阅读；文章删除、登录验证、风控或正文截断时只记录可见资料和限制，不把摘要当全文。
version: 1.0.0
repository: https://github.com/xxjrq/wechat-article-reading-brief-free
license: MIT
icon: icon-512.png
tags:
  - wechat
  - article-reading
  - research-brief
  - easy-webbridge
trigger_words:
  - 公众号文章阅读简报
  - 总结微信文章
  - 读取公众号文章
triggers:
  - 用指定浏览器阅读这篇公众号文章
  - 把这几篇微信文章整理成简报
  - 提取公众号文章的作者日期和关键步骤
interface:
  display_name: "公众号文章阅读简报"
  short_description: "用指定浏览器读取公众号文章并交付可溯源结论、关键步骤与缺项"
  default_prompt: "使用 $wechat-article-reading-brief-free，使用我指定的 browserId 读取 1–3 篇公开公众号文章 URL，围绕我的问题输出主结论、关键步骤、作者、日期、来源及未显示项；遇到登录、删除或截断请如实说明。"
  icon_small: "./icon-512.png"
  icon_large: "./icon-512.png"
policy:
  allow_implicit_invocation: false
self_test: node scripts/self-test.mjs
